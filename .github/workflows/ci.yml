name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新 push 取消尚未跑完的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun 是唯一的运行时与包管理器，版本取自 .bun-version
      - name: Resolve Bun version
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - run: bun install --frozen-lockfile

      # typecheck 是这里最关键的一步：Bun 运行时不做类型检查，
      # 不在 CI 拦，类型错误就没有任何关卡。
      - run: bun run check

      - run: bun run test:coverage

      # 探针不在 tsconfig 里（repro/README.md 的决定），所以改接口打死它们时
      # 上面那一步是全绿的。这一步跑它们一遍，只问「还起得来吗」。
      # 花钱的三个跑在本地 stub 上，CI 不会掏钱。
      - run: bun run probes:smoke

      # bench/ 不进 lint / typecheck / 冒烟（bench/README.md 的决定），是守卫的三不管
      # 地带。这一步对账冻结面的指纹：手改 fixture 或 measure 脚本 = 作废历史基线，
      # 必须在 git 里看得见，不许无声通过。
      - run: bun run bench:fingerprint

      - run: bun run build
