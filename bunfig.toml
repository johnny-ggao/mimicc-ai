[test]
# 覆盖率只在这里配报表，门槛不在这里——bun 1.3.14 的 coverageThreshold 是**按文件
# 逐个判**的（不是这段注释曾经以为的总体），src/console/repl.ts 那样单测够不着的
# 交互模块永远过不去，而且挂的时候一个字都不印。总体 0.8 的门禁挪到
# scripts/coverage-gate.ts，吃下面 lcov 的输出；为什么与考据见那个文件头。
# 注意 Bun 只统计被测试实际加载过的文件——完全没人 import 的模块不会拉低这个数字，
# 所以它是"已测代码的质量"指标，不是"测了多少"的指标。
coverageSkipTestFiles = true
# 报表两路：text 的表给人看，lcov 给 scripts/coverage-gate.ts 吃。
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
